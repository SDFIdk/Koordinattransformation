# spa config. unprivileged user, all writable paths under /tmp for
# readOnlyRootFilesystem, listens on 8080, tls at the ingress.

worker_processes 2;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # /tmp is the only writable mount
    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    open_file_cache max=2000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/xml
        application/xml+rss
        application/json
        application/javascript
        application/x-javascript
        image/svg+xml;

    # stdout/stderr for kubectl logs
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        charset utf-8;

        include SecHeaders.conf;

        # k8s probe
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # vite content-hashes everything under /assets, safe to pin
        location ^~ /assets/ {
            include SecHeaders.conf;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # never cache index.html so users get new asset refs on release.
        # internal redirects from try_files below re-enter location matching
        # and land here, so the fallback case is covered too.
        location = /index.html {
            include SecHeaders.conf;
            add_header Cache-Control "no-store" always;
        }

        location = /robots.txt {
            include SecHeaders.conf;
            try_files $uri =404;
            log_not_found off;
            access_log off;
        }

        location / {
            include SecHeaders.conf;
            try_files $uri $uri/ /index.html;
        }
    }
}
